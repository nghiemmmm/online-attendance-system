[pytest]
# Default command line arguments when running pytest
addopts = -v -ra --tb=short

# Directory containing the test suites
testpaths = tests

# Resolve python paths to prevent import errors (e.g. ModuleNotFoundError: No module named 'app')
pythonpath = .

# Directories to ignore during test discovery
norecursedirs = venv .git node_modules .github .agents

# Clean up console logs by ignoring deprecated warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Registered custom test categorization markers
markers =
    slow: Mark tests that are slow to execute (e.g. AI processing tests)
    integration: Mark integration flow tests
