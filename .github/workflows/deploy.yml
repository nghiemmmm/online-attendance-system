name: CI/CD - Build, Push to GHCR and Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - production
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Job 1 & 2: Build, Scan & Push Docker Images
  # ==========================================
  build-push-scan:
    name: Build, Scan and Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify GitHub Secrets Presence
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          NGHIEM_SECRET_DIEMDANH: ${{ secrets.NGHIEM_SECRET_DIEMDANH }}
        run: |
          echo "==== Verifying Secrets Presence ===="
          if [ -z "$EC2_HOST" ]; then echo "❌ Error: Code 101"; exit 1; fi
          if [ -z "$EC2_USER" ]; then echo "❌ Error: Code 102"; exit 1; fi
          if [ -z "$SSH_KEY" ]; then echo "❌ Error: Code 103"; exit 1; fi
          if [ -z "$NGHIEM_SECRET_DIEMDANH" ]; then echo "❌ Error: Code 104"; exit 1; fi
          echo "==== All required secrets are present ===="

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker Metadata (Tags)
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(git rev-parse --short HEAD)
          
          # Base image names
          BACKEND_IMAGE="ghcr.io/${REPO_LOWER}/attendance-backend"
          FRONTEND_IMAGE="ghcr.io/${REPO_LOWER}/attendance-frontend"
          
          # Generate tags list
          TAGS_BACKEND="${BACKEND_IMAGE}:latest,${BACKEND_IMAGE}:${SHA_SHORT}"
          TAGS_FRONTEND="${FRONTEND_IMAGE}:latest,${FRONTEND_IMAGE}:${SHA_SHORT}"
          
          # If triggered by a Git tag, append the tag name
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            TAGS_BACKEND="${TAGS_BACKEND},${BACKEND_IMAGE}:${TAG_NAME}"
            TAGS_FRONTEND="${TAGS_FRONTEND},${FRONTEND_IMAGE}:${TAG_NAME}"
          fi
          
          echo "backend_tags=${TAGS_BACKEND}" >> $GITHUB_OUTPUT
          echo "frontend_tags=${TAGS_FRONTEND}" >> $GITHUB_OUTPUT
          echo "sha_tag=${SHA_SHORT}" >> $GITHUB_OUTPUT

      # ----------------------------------------------------
      # 1. Build & Push Multi-Arch Images
      # ----------------------------------------------------
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # ==========================================
  # Job 3: Deploy to EC2 Production
  # ==========================================
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-push-scan]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Deploy Secrets Presence
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          echo "==== Verifying Deploy Secrets Presence ===="
          if [ -z "$EC2_HOST" ]; then echo "❌ Error: Code 201"; exit 1; fi
          if [ -z "$EC2_USER" ]; then echo "❌ Error: Code 202"; exit 1; fi
          if [ -z "$SSH_KEY" ]; then echo "❌ Error: Code 203"; exit 1; fi
          echo "==== All deploy secrets are present ===="

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SSL_FULLCHAIN: ${{ secrets.SSL_FULLCHAIN }}
          SSL_PRIVKEY: ${{ secrets.SSL_PRIVKEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GITHUB_SHA,SSL_FULLCHAIN,SSL_PRIVKEY
          script: |
            set -e
            DEPLOY_DIR="/home/${{ secrets.EC2_USER }}/app"
            BACKUP_DIR="/home/${{ secrets.EC2_USER }}/backups"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            
            echo "==== Step 1: Ensure directories exist ===="
            mkdir -p "$DEPLOY_DIR"
            mkdir -p "$BACKUP_DIR"
            
            # Navigate to deploy directory
            cd "$DEPLOY_DIR"
            
            echo "==== Step 2: Database Backup ===="
            # Safe backup of PostgreSQL database before changing anything
            if docker ps --format '{{.Names}}' | grep -q "db-diemdanh"; then
              echo "Backing up database..."
              docker exec -i db-diemdanh pg_dump -U root diemdanh > "$BACKUP_DIR/db_backup_$TIMESTAMP.sql" || \
              docker exec -i db-diemdanh pg_dump -U postgres dbdiemdanh > "$BACKUP_DIR/db_backup_$TIMESTAMP.sql" || \
              echo "Backup warning: check database status"
            else
              echo "No active DB container found to backup. Skipping."
            fi
            
            echo "==== Step 3: Git Pull and Env Check ===="
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            fi
            git fetch origin
            git checkout production
            git pull origin production
            
            echo "==== Step 3.5: Switch to Production Docker Configuration ===="
            bash switch-environment.sh prod

            # Recreate .env file directly from the single consolidated secret
            cat << 'EOF' > .env
            ${{ secrets.NGHIEM_SECRET_DIEMDANH }}
            EOF
            
            # Ensure proper permissions on the environment file
            chmod 600 .env
            
            echo "==== Step 3.6: Handle SSL Certificates ===="
            mkdir -p nginx/ssl
            
            # Write real certificates if present in secrets, else generate self-signed fallback
            if [ -n "$SSL_FULLCHAIN" ] && [ "$SSL_FULLCHAIN" != "[PLACEHOLDER FOR PRODUCTION FULLCHAIN SSL CERTIFICATE]" ]; then
              echo "Installing custom SSL Fullchain Certificate from GitHub Secrets..."
              echo "$SSL_FULLCHAIN" > nginx/ssl/fullchain.pem
            else
              if [ ! -f nginx/ssl/fullchain.pem ] || grep -q "PLACEHOLDER" nginx/ssl/fullchain.pem; then
                echo "No custom SSL Certificate found. Generating fallback self-signed SSL Certificate..."
                openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                  -keyout nginx/ssl/privkey.pem \
                  -out nginx/ssl/fullchain.pem \
                  -subj "/CN=localhost"
              fi
            fi

            if [ -n "$SSL_PRIVKEY" ] && [ "$SSL_PRIVKEY" != "[PLACEHOLDER FOR PRODUCTION PRIVATE KEY]" ]; then
              echo "Installing custom SSL Private Key from GitHub Secrets..."
              echo "$SSL_PRIVKEY" > nginx/ssl/privkey.pem
            fi
            
            chmod 600 nginx/ssl/*.pem
            
            echo "==== Step 4: Login GHCR & Pull Images ===="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull new images
            docker compose pull
            
            echo "==== Step 5: Stop active stack temporarily (with backup tags saved) ===="
            # Save the active container IDs for fallback reference
            ACTIVE_BACKEND_ID=$(docker ps -aqf "name=backend" || echo "")
            
            echo "==== Step 6: Alembic Database Migration & Seeding ===="
            # Run migrations on a temporary backend container
            docker compose run --rm backend alembic upgrade head || { echo "Alembic Migration failed!"; exit 1; }
            
            # Execute database seeding if the Postgres container is running
            if docker ps --format '{{.Names}}' | grep -q "db-diemdanh"; then
              echo "Seeding database with init.sql..."
              docker exec -i db-diemdanh psql -U root diemdanh < init.sql || echo "Seeding warning: check database init status"
            fi
            
            echo "==== Step 7: Spin up new containers ===="
            docker compose up -d
            
            echo "==== Step 8: Health Check & Rollback Logic ===="
            # Dynamic health check: Poll the health endpoint for up to 120 seconds (24 attempts * 5s)
            # This accounts for PyTorch loading model weights and database connection initialization.
            HEALTH_STATUS="failed"
            for i in {1..24}; do
              echo "Checking backend health status (attempt $i/24)..."
              # -L: Follows redirect (301) to HTTPS
              # -k: Bypasses SSL certificate verification for localhost
              STATUS=$(curl -s -L -k -o /dev/null -w "%{http_code}" "http://localhost/health" || echo "failed")
              if [ "$STATUS" = "200" ]; then
                HEALTH_STATUS="200"
                break
              fi
              echo "Backend is not ready yet (HTTP Status: $STATUS). Retrying in 5 seconds..."
              sleep 5
            done
            
            if [ "$HEALTH_STATUS" = "200" ]; then
              echo "✅ Health check passed! Deployment successful."
              
              echo "==== Step 9: Post-Deploy Cleanup ===="
              # Remove old unused Docker images to save disk space
              docker image prune -a -f
            else
              echo "❌ Health check failed with status: $HEALTH_STATUS."
              echo "==== DEBUG: Printing backend container logs ===="
              docker compose logs --tail=100 backend || echo "Failed to fetch backend logs"
              echo "==== DEBUG: Printing nginx container logs ===="
              docker compose logs --tail=100 nginx || echo "Failed to fetch nginx logs"
              
              echo "Rolling back to previous images!"
              
              # Revert Git checkout and up previous images
              git checkout HEAD@{1}
              docker compose pull
              docker compose up -d
              
              echo "Rollback completed. Restoring database from backup..."
              if [ -f "$BACKUP_DIR/db_backup_$TIMESTAMP.sql" ]; then
                # Restore database backup if Postgres is running
                if docker ps --format '{{.Names}}' | grep -q "db-diemdanh"; then
                  docker exec -i db-diemdanh psql -U root diemdanh < "$BACKUP_DIR/db_backup_$TIMESTAMP.sql" || \
                  docker exec -i db-diemdanh psql -U postgres dbdiemdanh < "$BACKUP_DIR/db_backup_$TIMESTAMP.sql" || \
                  echo "Restore database warning"
                fi
              fi
              exit 1
            fi

  # ==========================================
  # Job 4: Notifications
  # ==========================================
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [build-push-scan, deploy]
    if: always()
    steps:
      - name: Generate Job Status Report
        run: |
          BUILD_STATUS="${{ needs.build-push-scan.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          
          echo "### CD Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Build, Scan & Push | $BUILD_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Deploy | $DEPLOY_STATUS |" >> $GITHUB_STEP_SUMMARY
          
          if [ "$BUILD_STATUS" = "success" ] && [ "$DEPLOY_STATUS" = "success" ]; then
            echo "✅ **All CD jobs completed successfully. Production environment is healthy!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment failed. Rollback triggered on EC2 instances.**" >> $GITHUB_STEP_SUMMARY
          fi
