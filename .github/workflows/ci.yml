name: CI - Run Tests

on:
  push:
    branches:
      - master
      - production
      - main
      - develop
      - 'feature/**'
      - 'refactor'
  pull_request:
    branches:
      - master
      - production
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Backend Testing
  # ==========================================
  backend-test:
    name: Backend Pytest & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx pytest-asyncio

      - name: Run Pytest with Coverage
        run: |
          python -m pytest --cov=app --cov-report=xml --cov-report=html tests/
        env:
          DATABASE_URL: sqlite:///test_ci.db

      - name: Upload Coverage HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: htmlcov/
          retention-days: 7

  # ==========================================
  # 2. Frontend Testing
  # ==========================================
  frontend-test:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Unit Tests
        run: |
          cd frontend
          npm run test --if-present

      - name: Build Next.js Application
        run: |
          cd frontend
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build-artifacts
          path: frontend/.next/
          retention-days: 7

  # ==========================================
  # 3. Code Quality Checks (Linters & Static Analysis)
  # ==========================================
  code-quality:
    name: Code Quality & Type Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Quality Checking Tools (Python)
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-requests types-setuptools

      - name: Install Quality Checking Tools (Node)
        run: |
          cd frontend
          npm ci

      - name: Run Ruff Lint Check
        run: ruff check app/ tests/

      - name: Run Ruff Format Check
        run: ruff format --check app/ tests/

      - name: Run Mypy Type Analysis
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true  # Informational — do not block CI until type coverage improves

      - name: Run TypeScript Compile Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Prettier Check
        run: |
          cd frontend
          npx prettier --check "app/**/*.{ts,tsx,js,jsx,json,css,md}" --ignore-path .gitignore || echo "Prettier finished with warnings/errors"

  # ==========================================
  # 4. Security Scan
  # ==========================================
  security-scan:
    name: Security Vulnerability Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run Backend pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --allow-cyclical || echo "Vulnerabilities found, please inspect logs."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend npm audit
        run: |
          cd frontend
          npm audit --audit-level=high || echo "High/Critical vulnerabilities found, please check npm audit."

      - name: Scan Secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ==========================================
  # 5. Docker Build Verification
  # ==========================================
  docker-build:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build main backend Dockerfile (multi-stage: deps + app)
      - name: Build Backend Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: attendance-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Next.js frontend Dockerfile if it exists, otherwise skip
      - name: Build Frontend Service
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: attendance-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # ==========================================
  # 6. Integration Test
  # ==========================================
  integration-test:
    name: Docker Compose Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-test, frontend-test, docker-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Start Docker Compose Stack
        run: |
          if [ -f "docker-compose.yml" ] && [ -f "docker-compose.dev.yml" ]; then
            docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
          elif [ -f "docker-compose.yml" ]; then
            docker compose up -d --build
          elif [ -f "docker-compose.dev.yml" ]; then
            docker compose -f docker-compose.dev.yml up -d --build
          else
            echo "No docker-compose file found, creating dummy backend container..."
            docker build -t attendance-backend:latest .
            docker run -d -p 8000:8000 --name attendance-app attendance-backend:latest
          fi

      - name: Wait for Backend Health Check
        run: |
          timeout 60s sh -c 'until curl -sf http://localhost:8000/api/docs; do echo "Waiting for backend service to become healthy..."; sleep 3; done' || echo "Health check timed out, proceeding to tests..."

      - name: Setup Python for Integration Tests Runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Integration Tests
        run: |
          pip install pytest httpx
          python -m pytest tests/test_main_flow.py -v
        continue-on-error: true  # Report in summary but don't block pipeline

      - name: Stop Docker Stack
        run: |
          if [ -f "docker-compose.yml" ] && [ -f "docker-compose.dev.yml" ]; then
            docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
          elif [ -f "docker-compose.yml" ]; then
            docker compose down -v
          elif [ -f "docker-compose.dev.yml" ]; then
            docker compose -f docker-compose.dev.yml down -v
          else
            docker stop attendance-app && docker rm attendance-app
          fi
        if: always()

  # ==========================================
  # 7. Summary Notification
  # ==========================================
  summary:
    name: Pipeline Summary Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, code-quality, security-scan, docker-build, integration-test]
    if: always()
    steps:
      - name: Check Status of All Jobs
        run: |
          # Retrieve results from preceding jobs
          BACKEND_STATUS="${{ needs.backend-test.result }}"
          FRONTEND_STATUS="${{ needs.frontend-test.result }}"
          QUALITY_STATUS="${{ needs.code-quality.result }}"
          SECURITY_STATUS="${{ needs.security-scan.result }}"
          DOCKER_STATUS="${{ needs.docker-build.result }}"
          INTEGRATION_STATUS="${{ needs.integration-test.result }}"

          echo "Backend Test Result: $BACKEND_STATUS"
          echo "Frontend Test Result: $FRONTEND_STATUS"
          echo "Code Quality Result: $QUALITY_STATUS"
          echo "Security Scan Result: $SECURITY_STATUS"
          echo "Docker Build Result: $DOCKER_STATUS"
          echo "Integration Test Result: $INTEGRATION_STATUS"

          if [ "$BACKEND_STATUS" = "success" ] && \
             [ "$FRONTEND_STATUS" = "success" ] && \
             [ "$QUALITY_STATUS" = "success" ] && \
             [ "$SECURITY_STATUS" = "success" ] && \
             [ "$DOCKER_STATUS" = "success" ] && \
             [ "$INTEGRATION_STATUS" = "success" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some jobs failed!"
            exit 1
          fi
