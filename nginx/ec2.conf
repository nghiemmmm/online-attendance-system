# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR EC2 (HTTP ONLY)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Global proxy configurations
    client_max_body_size 100M;

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Common Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --------------------------------------------------
    # ROUTING RULES
    # --------------------------------------------------

    # Route A: Next.js Static Cache Optimization
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Route B: Next.js Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Route C: FastAPI Backend API Gateway
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
    }

    # Route D: WebSockets
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Route E: Face Recognition AI Service
    location /face-api/ {
        proxy_pass http://face-recognition:9000/;
        proxy_http_version 1.1;
    }

    # Route F: Health Check
    location /health {
        proxy_pass http://backend:8000/api/health;
        proxy_http_version 1.1;
    }

    # Route G: Swagger UI
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
    }

    # Route H: ReDoc
    location /redoc {
        proxy_pass http://backend:8000/redoc;
        proxy_http_version 1.1;
    }

    # Route I: Uploaded Images
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_http_version 1.1;
    }
}