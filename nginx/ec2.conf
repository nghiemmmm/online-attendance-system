# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR PRODUCTION EC2
# ==============================================================================

# 1. HTTP Server - Redirects all standard HTTP traffic to HTTPS (SSL)
server {
    listen 80;
    listen [::]:80;
    server_name _; # Responds to any domain/IP

    # Let's Encrypt Acme Challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Reverse Proxy and Gateway logic
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # SSL Certificate configurations (mounted in Docker)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL protocols and optimizations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Production Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # Allow camera for live face-recognition stream
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Global proxy configurations
    client_max_body_size 100M; # Support large image upload
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Common Proxy Headers passed to downstream containers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --------------------------------------------------
    # ROUTING RULES
    # --------------------------------------------------

    # Route A: Next.js Static Cache Optimization
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Route B: Next.js Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Route C: FastAPI Backend API Gateway
    location /api/ {
        proxy_pass http://backend:8000; # Keep /api prefix unchanged
        proxy_http_version 1.1;
    }

    # Route D: WebSockets (WebRTC Signaling or real-time sockets)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Route E: Face Recognition AI Service (Port 9000)
    location /face-api/ {
        # Trims the '/face-api/' prefix when proxying to the AI Service
        proxy_pass http://face-recognition:9000/;
        proxy_http_version 1.1;
    }

    # Route F: Health Check Endpoint Routing
    location /health {
        # Redirect health queries directly to FastAPI health handler
        proxy_pass http://backend:8000/api/health;
        proxy_http_version 1.1;
    }

    # Route G: FastAPI Interactive Documentation (Swagger UI)
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
    }

    # Route H: FastAPI Alternate Interactive Documentation (ReDoc)
    location /redoc {
        proxy_pass http://backend:8000/redoc;
        proxy_http_version 1.1;
    }

    # Route I: Static Uploaded Face/Attendance images
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_http_version 1.1;
    }
}
