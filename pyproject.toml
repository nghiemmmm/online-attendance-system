[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diemdanh"
version = "0.1.0"
description = "FastAPI attendance management application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pillow==10.1.0",
    "torch==2.1.1",
    "torchvision==0.16.1",
    "pandas==2.1.4",
    "python-multipart>=0.0.9",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "python-dotenv==1.0.0",
    "PyJWT==2.8.0",
    "pwdlib[argon2]",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.14",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.27.0",
    "pgvector",
    "email-validator",
    "passlib==1.7.4",
    "bcrypt==4.0.1",
    "aiofiles==23.2.1",
    "authlib==1.3.2",
    "itsdangerous==2.2.0",
    "cloudinary==1.40.0",
    "faiss-cpu==1.11.0",
    "aiortc",
    "Jinja2",
    "facenet-pytorch",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "httpx==0.25.2",
    "mypy>=1.8",
    "ruff==0.6.9",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app", "tests"]
exclude = ["scratch", "scripts", "run_init_sql.py", "scratch_comprehensive_scan.py", "app/alembic"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
]
ignore = [
    "B008",   # function-call-in-default-argument (FastAPI Depends pattern)
    "E501",   # line-too-long — ruff formatter handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E402",   # module-import-not-at-top (test fixtures often need late imports)
]
"app/**/*.py" = [
    "E402",   # FastAPI apps use late/conditional imports in route handlers
]
"**/__init__.py" = [
    "F401",   # unused-import — __init__.py re-exports symbols intentionally
]
"tests/conftest.py" = [
    "E402",   # conftest patches modules before importing app
    "F401",   # conftest imports models to register them
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

